<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skills carousel</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="description" content="A 3D carousel of the tools I work with. Drag to spin it." />
  </head>
  <body>
    <main>
      <h1>Skills carousel</h1>
      <p class="lede">
        The tools I work with, each logo built in 3D. Drag to spin, hover one to see what it is.
      </p>
      <div class="stage">
        <canvas
          id="carousel"
          tabindex="0"
          aria-label="Two spinning rings of 3D logos for the tools I use. Use the left and right arrow keys to turn them."
        ></canvas>
        <p id="caption" aria-live="polite"></p>
        <ul id="skills" class="sr-only"></ul>
      </div>
      <footer>
        Built by <a href="https://zohair-portfolio-eta.vercel.app">Zohair Syed</a>.
        <a href="https://github.com/zo2450/threejs-projects/tree/main/skills-carousel">Source on GitHub</a>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
